name: Publicar sitio

# En cada push a main se publica con la foto de datos del repo (reproducible).
# Una vez por mes baja datos nuevos de datos.gob.ar y corre la QA:
# si pasa, publica con los datos nuevos; si falla, publica con la foto.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 12 20 * *" # día 20 de cada mes, después de que el INDEC publica el IPC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Datos nuevos de datos.gob.ar + QA
        id: online
        if: github.event_name != 'push'
        continue-on-error: true
        run: python -m inflationarg all --online
      - name: Foto offline del repo
        if: github.event_name == 'push' || steps.online.outcome != 'success'
        run: python -m inflationarg all
      - name: Resumen de la QA
        run: cat build/qa/reporte.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
