name: Publicar sitio

# Genera el sitio y lo publica en la rama gh-pages (GitHub Pages la sirve en
# https://juanmbf.github.io/InflationArg/), en cada push a main y una vez por mes.
# Siempre intenta bajar datos nuevos de datos.gob.ar y correr la QA: si pasan,
# publica con los datos nuevos (así un push no vuelve el sitio a la foto vieja);
# si fallan, publica con la foto del repo y la corrida termina en rojo para avisar.
# La CI (ci.yml) valida la foto del repo de forma reproducible.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 12 20 * *" # día 20 de cada mes, después de que el INDEC publica el IPC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Datos nuevos de datos.gob.ar + QA
        id: online
        continue-on-error: true
        run: python -m inflationarg all --online
      - name: Foto offline del repo
        if: steps.online.outcome != 'success'
        run: python -m inflationarg all
      - name: Resumen de la QA
        run: cat build/qa/reporte.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar en gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd build/site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Sitio generado desde ${GITHUB_SHA::7} (${{ github.event_name }})"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      - name: Avisar si falló la descarga online
        if: steps.online.outcome == 'failure'
        run: |
          echo "**La descarga de datos.gob.ar o su QA falló: se publicó la foto del repo.**" >> "$GITHUB_STEP_SUMMARY"
          echo "::error::La descarga de datos.gob.ar o su QA falló; se publicó la foto del repo"
          exit 1
